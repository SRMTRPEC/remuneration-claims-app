<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Login - APRIL MAY Remuneration Claim Management System">
  <title>Admin Login | Remuneration Claims</title>
  <link rel="stylesheet" href="/css/styles.css?v=20">
  <link rel="stylesheet" href="/css/admin.css?v=20">
</head>
<body>
  <!-- ── Animated Background ──────────────────────────────────────── -->
  <div class="background-mesh">
    <div class="blob-1"></div>
    <div class="blob-2"></div>
  </div>

  <div class="login-page">
    <div class="login-card animate-fade-in">
      <div class="login-header">
        <div class="login-icon">🛡️</div>
        <h2 class="login-title">Admin Portal</h2>
        <p class="login-subtitle">Remuneration Claims Management</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div style="margin-bottom: var(--space-lg);">
          <label style="display:block; margin-bottom:6px; font-weight:600; font-size:0.82rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em;">Username</label>
          <input type="text" class="login-input" id="username" name="username" placeholder="Enter username" required autocomplete="off" style="text-align:left;">
        </div>
        <div style="margin-bottom: var(--space-xl); position: relative;">
          <label style="display:block; margin-bottom:6px; font-weight:600; font-size:0.82rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em;">Password</label>
          <div style="position:relative;">
            <input type="password" class="login-input" id="password" name="password" placeholder="Enter password" required autocomplete="off" style="text-align:left; padding-right: 3rem;">
            <button type="button" onclick="togglePassword(this)" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--text-muted); padding:4px;">👁️</button>
          </div>
          <div style="text-align: right; margin-top: 0.5rem;">
            <a href="#" onclick="showToast('Please contact your administrator to reset your password.', 'info', 'Password Reset'); return false;" style="font-size: 0.82rem; color: var(--primary-400); text-decoration: none; font-weight:600;">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div style="margin-top:var(--space-xl); text-align:center;">
        <p style="font-size:0.88rem;color:var(--text-muted); margin-bottom:var(--space-sm);">
          <a href="/login" style="color:var(--primary-500);font-weight:600;">← Staff Login</a>
        </p>
        <p style="font-size:0.82rem;color:var(--text-muted);">
          <a href="/" style="color:var(--text-muted);font-weight:600;">Back to Claim Form</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=20"></script>
  <script src="/js/auth.js?v=20"></script>
  <script>
    function togglePassword(btn) {
      const input = btn.parentElement.querySelector('input');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>
</body>
</html>
